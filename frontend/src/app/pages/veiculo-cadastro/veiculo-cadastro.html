<app-navbar></app-navbar>

<main class="veiculo-page">
  <section class="veiculo-card">

    <header class="veiculo-header">
      <span class="page-label">CADASTRO DE VEÍCULO</span>

      <h1>Cadastrar veículo</h1>

      <p>
        Preencha os dados para adicionar um novo veículo ao sistema.
      </p>
    </header>

    <form
      class="veiculo-form"
      #formulario="ngForm"
      (ngSubmit)="cadastrar(formulario)"
      autocomplete="off"
    >
      <div class="form-group">
        <label for="chassi">Chassi</label>

        <input
          id="chassi"
          type="text"
          name="chassi"
          [(ngModel)]="chassi"
          maxlength="17"
          minlength="17"
          placeholder="17 caracteres"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="marca">Marca</label>

        <input
          id="marca"
          type="text"
          name="marca"
          [(ngModel)]="marca"
          maxlength="50"
          placeholder="Ex.: Toyota"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="modelo">Modelo</label>

        <input
          id="modelo"
          type="text"
          name="modelo"
          [(ngModel)]="modelo"
          maxlength="80"
          placeholder="Ex.: Corolla"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="cor">Cor</label>

        <input
          id="cor"
          type="text"
          name="cor"
          [(ngModel)]="cor"
          maxlength="30"
          placeholder="Ex.: Prata"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="dataFabricacao">
          Data de fabricação
        </label>

        <input
          id="dataFabricacao"
          type="date"
          name="dataFabricacao"
          [(ngModel)]="dataFabricacao"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="valorVeiculo">
          Valor do veículo
        </label>

        <input
          id="valorVeiculo"
          type="number"
          name="valorVeiculo"
          [(ngModel)]="valorVeiculo"
          min="0.01"
          step="0.01"
          placeholder="Ex.: 129900"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="statusDisponibilidade">
          Status
        </label>

        <select
          id="statusDisponibilidade"
          name="statusDisponibilidade"
          [(ngModel)]="statusDisponibilidade"
          required
          [disabled]="enviando"
        >
          <option value="disponivel">
            Disponível
          </option>

          <option value="reservado">
            Reservado
          </option>

          <option value="vendido">
            Vendido
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo</label>

        <select
          id="tipo"
          name="tipo"
          [(ngModel)]="tipo"
          (ngModelChange)="alterarTipo()"
          required
          [disabled]="enviando"
        >
          <option value="NOVO">
            Novo
          </option>

          <option value="USADO">
            Usado
          </option>
        </select>
      </div>

      <ng-container *ngIf="tipo === 'USADO'">

        <div class="form-group">
          <label for="placa">Placa</label>

          <input
            id="placa"
            type="text"
            name="placa"
            [(ngModel)]="placa"
            minlength="7"
            maxlength="7"
            placeholder="Ex.: ABC1D23"
            required
            [disabled]="enviando"
          />
        </div>

        <div class="form-group">
          <label for="quilometragem">
            Quilometragem
          </label>

          <input
            id="quilometragem"
            type="number"
            name="quilometragem"
            [(ngModel)]="quilometragem"
            min="0"
            placeholder="Ex.: 25000"
            required
            [disabled]="enviando"
          />
        </div>

      </ng-container>

      <p
        class="error-message"
        *ngIf="mensagemErro"
      >
        {{ mensagemErro }}
      </p>

      <p
        class="success-message"
        *ngIf="mensagemSucesso"
      >
        {{ mensagemSucesso }}
      </p>

      <button
        class="submit-button"
        type="submit"
        [disabled]="enviando"
      >
        {{
          enviando
            ? 'Cadastrando...'
            : 'Cadastrar veículo'
        }}
      </button>

    </form>

  </section>
</main>
