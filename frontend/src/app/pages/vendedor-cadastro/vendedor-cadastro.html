<app-navbar></app-navbar>

<main class="vendedor-page">
  <section class="vendedor-card">

    <header class="vendedor-header">
      <span class="page-label">
        CADASTRO DE VENDEDOR
      </span>

      <h1>Cadastrar vendedor</h1>

      <p>
        Informe os dados do vendedor.
      </p>
    </header>

    <form
      class="vendedor-form"
      #formulario="ngForm"
      (ngSubmit)="cadastrar(formulario)"
      autocomplete="off"
    >
      <div class="form-group">
        <label for="nome">Nome</label>

        <input
          id="nome"
          type="text"
          name="nome"
          [(ngModel)]="nome"
          maxlength="120"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="cpf">CPF</label>

        <input
          id="cpf"
          type="text"
          name="cpf"
          [(ngModel)]="cpf"
          minlength="11"
          maxlength="11"
          pattern="[0-9]{11}"
          placeholder="Somente números"
          required
          [disabled]="enviando"
        />
      </div>

      <p
        class="error-message"
        *ngIf="mensagemErro"
      >
        {{ mensagemErro }}
      </p>

      <p
        class="success-message"
        *ngIf="mensagemSucesso"
      >
        {{ mensagemSucesso }}
      </p>

      <button
        type="submit"
        class="submit-button"
        [disabled]="enviando"
      >
        {{
          enviando
            ? 'Cadastrando...'
            : 'Cadastrar vendedor'
        }}
      </button>
    </form>

  </section>
</main>
